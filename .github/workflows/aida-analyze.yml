name: AIDA Analyze

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -w build

      - name: Run AIDA (full history on main)
        if: github.event_name == 'push'
        run: |
          node packages/cli/dist/index.js collect --out-dir ./.aida
          node packages/cli/dist/index.js analyze --out-dir ./.aida
          node packages/cli/dist/index.js report --out-dir ./.aida

      - name: Run AIDA (PR-scoped)
        if: github.event_name == 'pull_request'
        run: |
          node packages/cli/dist/index.js collect --pr --out-dir ./.aida
          node packages/cli/dist/index.js analyze --out-dir ./.aida
          node packages/cli/dist/index.js report --out-dir ./.aida
          node packages/cli/dist/index.js comment --out-dir ./.aida
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AIDA artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aida-report
          path: |
            ./.aida/commit-stream.json
            ./.aida/metrics.json
            ./.aida/report.md
